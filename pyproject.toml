[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-router"
version = "0.2.0"
description = "Pick an LLM by task, budget, latency or context window from model profiles you control. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["llm", "model-routing", "ai", "cost-optimization", "claude", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.17.5,<0.18", "pytest>=9.2.0"]

[project.urls]
Homepage = "https://github.com/Viprasol-Tech/model-router"
Repository = "https://github.com/Viprasol-Tech/model-router"
Issues = "https://github.com/Viprasol-Tech/model-router/issues"
Website = "https://viprasol.com"

[project.scripts]
model-router = "model_router.core:main"

[tool.hatch.build.targets.wheel]
packages = ["model_router"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
